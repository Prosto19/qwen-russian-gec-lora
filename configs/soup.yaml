base: Qwen/Qwen2.5-1.5B-Instruct
task: sft
backend: transformers

data:
  train: /content/train.jsonl
  format: alpaca
  max_length: 512
  val_split: 0.1

training:
  epochs: 2
  lr: 0.0001
  batch_size: 1
  gradient_accumulation_steps: 8
  quantization: none
  optimizer: adamw_torch
  gradient_checkpointing: true
  seed: 42
  logging_steps: 10
  save_steps: 100
  lora:
    r: 16
    alpha: 32
    dropout: 0.05

output: /content/soup_qwen_gec_output
